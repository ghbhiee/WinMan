name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Run geometry tests and type check
        run: ./scripts/test.sh

      - name: Build without signing
        run: |
          xcodebuild \
            -project WinMan.xcodeproj \
            -scheme WinMan \
            -configuration Release \
            -destination "generic/platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            build
